# Builds datasafety.sanikant.dev on every push: regenerates the SDK and reference pages from the
# skill, builds and checks the site. Deploys to Cloudflare Workers only when the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist (see site/DEPLOY.md).
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate pages and build
        run: npm run build

      - name: Generated pages are committed
        run: git diff --exit-code -- src/content/docs/sdk src/content/docs/reference src/data

      - name: Check SEO, links and structure
        run: npm run check

      - name: Deploy to Cloudflare Workers
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
